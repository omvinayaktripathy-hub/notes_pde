<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0A6B" />
      <stop offset="60%" stop-color="#050505" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#80f2ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield in Royal Amethyst & Jet Black with Cyan Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#primaryGrad)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)" />
  
  <!-- Open Book Pages in Crisp White / Electric Cyan Tint -->
  <path d="M16 42 C22 39, 28 40, 32 43 C36 40, 42 39, 48 42 L48 24 C42 21, 36 22, 32 25 C28 22, 22 21, 16 24 Z" 
        fill="#ffffff" fill-opacity="0.95" />
  <path d="M32 25 L32 43" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Graduation Cap Atop Book in Electric Cyan Accent -->
  <polygon points="32,13 46,18 32,23 18,18" fill="url(#cyanGrad)" />
  <polygon points="32,23 37,21.2 37,25 32,27" fill="#00b4d8" />
  <circle cx="45" cy="22" r="1.5" fill="#ffffff" />
</svg>
