# ==============================================================================
# NGINX LOAD BALANCER & REVERSE PROXY CONFIGURATION
# High-Throughput Cluster Proxy with SSL Termination, Gzip & Edge Rate Limiting
# ==============================================================================

# Define upstream node instances cluster for round-robin / least_conn load balancing
upstream notes_platform_cluster {
    least_conn; # Distribute incoming requests to the instance with the least active connections
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Edge rate limiting zone (protects backend node processes)
limit_req_zone $binary_remote_addr zone=edge_req_limit:10m rate=15r/s;

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name notes.campus.edu www.notes.campus.edu;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Secure HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.campus.edu;

    # SSL / TLS Hardening
    ssl_certificate /etc/letsencrypt/live/notes.campus.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.campus.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Client payload size limits (matches Multer 25MB note upload limit)
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Health check bypass (used by AWS ELB / GCP Load Balancer / Kubernetes)
    location /health {
        proxy_pass http://notes_platform_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Static Assets Caching
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff2)$ {
        proxy_pass http://notes_platform_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Dynamic Application Requests
    location / {
        limit_req zone=edge_req_limit burst=25 nodelay;

        proxy_pass http://notes_platform_cluster;
        proxy_http_version 1.1;
        
        # Real IP & Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
